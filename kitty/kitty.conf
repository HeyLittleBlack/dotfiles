font_family Maple Mono Normal NF CN
font_size 16.0
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
background_opacity 0.9
dynamic_background_opacity yes
map ctrl+alt+enter launch --cwd=current
map F2 launch --cwd=current --location=vsplit
map kitty_mod+alt+t set_tab_title
macos_option_as_alt yes
map kitty_mod+j previous_tab
map kitty_mod+k next_tab
scrollback_pager vim -u NORC - -c 'w! /tmp/kitty_scrollback' -c 'term ++curwin cat /tmp/kitty_scrollback'
enabled_layouts splits
# map ctrl+grave>minus launch --cwd=current --location=hsplit
# map ctrl+`>backslash launch --cwd=current --location=vsplit
# map ctrl+`>left neighboring_window left
# map ctrl+`>right neighboring_window right
# map ctrl+`>up neighboring_window up
# map ctrl+`>down neighboring_window down
# map ctrl+`>h neighboring_window left
# map ctrl+`>l neighboring_window right
# map ctrl+`>k neighboring_window up
# map ctrl+`>j neighboring_window down
map alt+shift+left previous_tab
map alt+shift+right next_tab
map alt+`>minus launch --cwd=current --location=hsplit
map alt+`>backslash launch --cwd=current --location=vsplit
map alt+`>left neighboring_window left
map alt+`>right neighboring_window right
map alt+`>up neighboring_window up
map alt+`>down neighboring_window down
map alt+`>h neighboring_window left
map alt+`>l neighboring_window right
map alt+`>k neighboring_window up
map alt+`>j neighboring_window down
mouse_map right click grabbed copy_and_clear_or_interrupt
mouse_map right click ungrabbed paste_from_clipboard
include current-theme.conf
