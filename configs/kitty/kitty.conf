font_family Maple Mono Normal NF CN
font_size 16.0
# ponytail: detect idle shells by name; extend the list when using another shell.
tab_title_template "{index}: {tab.active_exe if tab.active_exe.lstrip('-') not in ('', 'sh', 'bash', 'zsh', 'fish', 'dash', 'ksh', 'nu') else (tab.active_wd.rstrip('/').rsplit('/', 1)[-1] or '/')}"
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
background_opacity 0.9
dynamic_background_opacity no
map ctrl+alt+enter launch --cwd=current
map F2 launch --cwd=current --location=vsplit
map kitty_mod+alt+r set_tab_title
macos_option_as_alt yes
map kitty_mod+j previous_tab
map kitty_mod+k next_tab
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
map ctrl+shift+0 goto_tab 999
scrollback_pager vim -u NORC -i NONE -n - -c 'let g:scrollback_file = tempname()' -c 'execute "write! " . fnameescape(g:scrollback_file)' -c 'call term_start(["cat", g:scrollback_file], {"curwin": 1, "exit_cb": {job, status -> delete(g:scrollback_file)}})'
enabled_layouts splits
# map ctrl+grave>minus launch --cwd=current --location=hsplit
# map ctrl+`>backslash launch --cwd=current --location=vsplit
# map ctrl+`>left neighboring_window left
# map ctrl+`>right neighboring_window right
# map ctrl+`>up neighboring_window up
# map ctrl+`>down neighboring_window down
# map ctrl+`>h neighboring_window left
# map ctrl+`>l neighboring_window right
# map ctrl+`>k neighboring_window up
# map ctrl+`>j neighboring_window down
# map alt+shift+left previous_tab
# map alt+shift+right next_tab
map alt+`>minus launch --cwd=current --location=hsplit
map alt+`>backslash launch --cwd=current --location=vsplit
map alt+`>left neighboring_window left
map alt+`>right neighboring_window right
map alt+`>up neighboring_window up
map alt+`>down neighboring_window down
map alt+`>h neighboring_window left
map alt+`>l neighboring_window right
map alt+`>k neighboring_window up
map alt+`>j neighboring_window down
mouse_map right press ungrabbed,grabbed kitten copy_or_paste.py
map alt+k send_key right
map ctrl+shift+b launch --allow-remote-control kitty +kitten broadcast --match-tab state:focused
include current-theme.conf
